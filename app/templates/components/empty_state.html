<div class="flex flex-col items-center justify-center rounded-xl border border-dashed border-slate-300 bg-slate-50 py-16 px-6 text-center">
  <div class="mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-indigo-50 text-indigo-600">
    <i data-lucide="{{ icon|default('inbox') }}" class="h-7 w-7"></i>
  </div>
  <h3 class="text-lg font-semibold text-slate-900">{{ title }}</h3>
  <p class="mt-2 max-w-sm text-sm text-slate-500">{{ description }}</p>
  {% if cta_url and cta_label %}
  <a href="{{ cta_url }}" class="mt-6 inline-flex items-center rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-indigo-500">
    {{ cta_label }}
  </a>
  {% endif %}
</div>
