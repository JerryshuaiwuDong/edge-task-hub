{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
  <h2 class="text-lg font-semibold">Settings</h2>
  <dl class="mt-4 space-y-4 text-sm">
    <div><dt class="text-slate-500">Lark/Feishu Webhook</dt><dd class="font-medium">{{ webhook_status }}</dd></div>
    <div><dt class="text-slate-500">Default Timezone</dt><dd class="font-medium">{{ timezone }}</dd></div>
    <div><dt class="text-slate-500">Database</dt><dd class="font-medium">SQLite (data/edge_task_hub.db)</dd></div>
  </dl>
  <p class="mt-6 text-xs text-slate-400">Edit ~/edge-task-hub/.env to update FEISHU_WEBHOOK_URL, then restart the service.</p>
</div>
{% endblock %}
